name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # uv sync 会按 pyproject 的 requires-python (>=3.12) 自动下载合适的 Python
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q
