services:
  official-monitor:
    build:
      context: ../monitor
      dockerfile: Dockerfile
    image: trendradar-official-monitor:scrapling-0.4.10
    container_name: trendradar-official-monitor
    restart: unless-stopped

    entrypoint: ["python", "-m", "monitor.official_monitor"]

    ports:
      - "127.0.0.1:8090:8090"

    volumes:
      - ../monitor:/app/monitor:ro
      - ../config:/app/config:ro
      - ../output/official-monitor:/app/state

    environment:
      - TZ=Asia/Shanghai
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-900}
      - MONITOR_BATCH_SIZE=${MONITOR_BATCH_SIZE:-75}
      - MONITOR_SCAN_CONCURRENCY=${MONITOR_SCAN_CONCURRENCY:-8}
      - MONITOR_SCAN_DYNAMIC_CONCURRENCY=${MONITOR_SCAN_DYNAMIC_CONCURRENCY:-2}
      - MONITOR_SCAN_STEALTH_CONCURRENCY=${MONITOR_SCAN_STEALTH_CONCURRENCY:-1}
      - MONITOR_REQUEST_TIMEOUT=${MONITOR_REQUEST_TIMEOUT:-15}
      - MONITOR_DYNAMIC_FETCH_LIMIT=${MONITOR_DYNAMIC_FETCH_LIMIT:-5}
      - MONITOR_STEALTH_FETCH_LIMIT=${MONITOR_STEALTH_FETCH_LIMIT:-2}
      - MONITOR_BROWSER_HARD_TIMEOUT=${MONITOR_BROWSER_HARD_TIMEOUT:-75}
      - MONITOR_CLOUDFLARE_SOLVER_ENABLED=${MONITOR_CLOUDFLARE_SOLVER_ENABLED:-true}
      - MONITOR_CLOUDFLARE_TIMEOUT=${MONITOR_CLOUDFLARE_TIMEOUT:-60}
      - MONITOR_AGENT_MAX_ATTEMPTS=${MONITOR_AGENT_MAX_ATTEMPTS:-3}
      - MONITOR_AGENT_MAX_DURATION=${MONITOR_AGENT_MAX_DURATION:-180}
      - MONITOR_CHECKPOINT_EVERY=${MONITOR_CHECKPOINT_EVERY:-10}
      - MONITOR_FAILURE_RETRY_INTERVAL=${MONITOR_FAILURE_RETRY_INTERVAL:-30}
      - MONITOR_CRITICAL_CHECK_INTERVAL=${MONITOR_CRITICAL_CHECK_INTERVAL:-21600}
      - MONITOR_POLICY_CHECK_INTERVAL=${MONITOR_POLICY_CHECK_INTERVAL:-86400}
      - MONITOR_REFERENCE_CHECK_INTERVAL=${MONITOR_REFERENCE_CHECK_INTERVAL:-604800}
      - MONITOR_CANDIDATE_CHECK_INTERVAL=${MONITOR_CANDIDATE_CHECK_INTERVAL:-86400}
      - MONITOR_FAILURE_BACKOFF_BASE=${MONITOR_FAILURE_BACKOFF_BASE:-21600}
      - MONITOR_FAILURE_BACKOFF_MAX=${MONITOR_FAILURE_BACKOFF_MAX:-604800}
      - MONITOR_RECURRING_QUEUE_PERCENT=${MONITOR_RECURRING_QUEUE_PERCENT:-65}
      - MONITOR_RECOVERY_QUEUE_PERCENT=${MONITOR_RECOVERY_QUEUE_PERCENT:-15}
      - MONITOR_BASELINE_QUEUE_PERCENT=${MONITOR_BASELINE_QUEUE_PERCENT:-10}
      - MONITOR_CANDIDATE_QUEUE_PERCENT=${MONITOR_CANDIDATE_QUEUE_PERCENT:-10}
      - MONITOR_HEALTH_MAX_STALE_SECONDS=${MONITOR_HEALTH_MAX_STALE_SECONDS:-1800}
      - MONITOR_INVENTORY=/app/state/knowledge_sources.json
      - MONITOR_DATABASE=/app/state/monitor.db
      - MONITOR_PORT=8090
      - MONITOR_POLICY_DIGEST_ENABLED=${MONITOR_POLICY_DIGEST_ENABLED:-true}
      - MONITOR_AI_SUMMARY_ENABLED=${MONITOR_AI_SUMMARY_ENABLED:-true}
      - MONITOR_AI_SUMMARY_BATCH_SIZE=${MONITOR_AI_SUMMARY_BATCH_SIZE:-20}
      - MONITOR_AI_SUMMARY_CONCURRENCY=${MONITOR_AI_SUMMARY_CONCURRENCY:-4}
      - MONITOR_AI_SUMMARY_INTERVAL=${MONITOR_AI_SUMMARY_INTERVAL:-5}
      - MONITOR_AI_SUMMARY_REQUEST_TIMEOUT=${MONITOR_AI_SUMMARY_REQUEST_TIMEOUT:-90}
      - MONITOR_AI_SUMMARY_HARD_TIMEOUT=${MONITOR_AI_SUMMARY_HARD_TIMEOUT:-120}
      - MONITOR_AI_SUMMARY_RETRIES=${MONITOR_AI_SUMMARY_RETRIES:-0}
      - MONITOR_SITE_DISCOVERY_ENABLED=${MONITOR_SITE_DISCOVERY_ENABLED:-true}
      - MONITOR_SITE_DISCOVERY_SITES_PER_CYCLE=${MONITOR_SITE_DISCOVERY_SITES_PER_CYCLE:-40}
      - MONITOR_SITE_DISCOVERY_CONCURRENCY=${MONITOR_SITE_DISCOVERY_CONCURRENCY:-4}
      - MONITOR_SITE_DISCOVERY_CYCLE_INTERVAL=${MONITOR_SITE_DISCOVERY_CYCLE_INTERVAL:-30}
      - MONITOR_SITE_DISCOVERY_CIRCUIT_SECONDS=${MONITOR_SITE_DISCOVERY_CIRCUIT_SECONDS:-21600}
      - MONITOR_SITE_DISCOVERY_INTERVAL=${MONITOR_SITE_DISCOVERY_INTERVAL:-86400}
      - MONITOR_SITE_DISCOVERY_MAX_SITEMAPS=${MONITOR_SITE_DISCOVERY_MAX_SITEMAPS:-12}
      - MONITOR_SITE_DISCOVERY_MAX_URLS=${MONITOR_SITE_DISCOVERY_MAX_URLS:-150}
      - MONITOR_SITE_DISCOVERY_MAX_PAGES=${MONITOR_SITE_DISCOVERY_MAX_PAGES:-6}
      - MONITOR_SITE_DISCOVERY_MAX_DEPTH=${MONITOR_SITE_DISCOVERY_MAX_DEPTH:-2}
      - MONITOR_SITE_DISCOVERY_DEEP_INTERVAL=${MONITOR_SITE_DISCOVERY_DEEP_INTERVAL:-604800}
      - MONITOR_SITE_DISCOVERY_DEEP_MAX_SITEMAPS=${MONITOR_SITE_DISCOVERY_DEEP_MAX_SITEMAPS:-50}
      - MONITOR_SITE_DISCOVERY_DEEP_MAX_URLS=${MONITOR_SITE_DISCOVERY_DEEP_MAX_URLS:-5000}
      - MONITOR_SITE_DISCOVERY_DEEP_MAX_PAGES=${MONITOR_SITE_DISCOVERY_DEEP_MAX_PAGES:-50}
      - MONITOR_SITE_DISCOVERY_DEEP_MAX_DEPTH=${MONITOR_SITE_DISCOVERY_DEEP_MAX_DEPTH:-4}
      - MONITOR_SITE_INVENTORY_MEDIUM_FETCH_PER_SITE=${MONITOR_SITE_INVENTORY_MEDIUM_FETCH_PER_SITE:-20}
      - MONITOR_SITE_INVENTORY_LOW_SAMPLE_PER_SITE=${MONITOR_SITE_INVENTORY_LOW_SAMPLE_PER_SITE:-5}
      - MONITOR_SITE_INVENTORY_SAMPLE_INTERVAL=${MONITOR_SITE_INVENTORY_SAMPLE_INTERVAL:-2592000}
      - MONITOR_KATANA_ENABLED=${MONITOR_KATANA_ENABLED:-true}
      - MONITOR_KATANA_PATH=/usr/local/bin/katana
      - MONITOR_KATANA_DEPTH=${MONITOR_KATANA_DEPTH:-3}
      - MONITOR_KATANA_MAX_PAGES=${MONITOR_KATANA_MAX_PAGES:-150}
      - MONITOR_KATANA_CRAWL_DURATION=${MONITOR_KATANA_CRAWL_DURATION:-30}
      - MONITOR_KATANA_PROCESS_TIMEOUT=${MONITOR_KATANA_PROCESS_TIMEOUT:-45}
      - MONITOR_KATANA_DEEP_DEPTH=${MONITOR_KATANA_DEEP_DEPTH:-5}
      - MONITOR_KATANA_DEEP_MAX_PAGES=${MONITOR_KATANA_DEEP_MAX_PAGES:-1000}
      - MONITOR_KATANA_DEEP_CRAWL_DURATION=${MONITOR_KATANA_DEEP_CRAWL_DURATION:-120}
      - MONITOR_KATANA_DEEP_PROCESS_TIMEOUT=${MONITOR_KATANA_DEEP_PROCESS_TIMEOUT:-150}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-deepseek/deepseek-v4-flash}
      - AI_API_BASE=${AI_API_BASE:-}

    healthcheck:
      test: ["CMD", "python", "/app/monitor/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  gptmail-key-refresh:
    image: trendradar-official-monitor:scrapling-0.4.10
    container_name: trendradar-gptmail-key-refresh
    restart: unless-stopped
    depends_on:
      official-monitor:
        condition: service_healthy
    entrypoint: ["python", "-m", "monitor.skills.gptmail_otp.provider", "watch"]
    volumes:
      - ../monitor:/app/monitor:ro
      - ../output/official-monitor:/app/state
    environment:
      - TZ=Asia/Shanghai
      - MONITOR_STATE_DIR=/app/state

  trendradar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: trendradar:local-spider-xhs
    container_name: trendradar
    restart: unless-stopped

    depends_on:
      official-monitor:
        condition: service_healthy

    ports:
      - "127.0.0.1:${WEBSERVER_PORT:-8080}:${WEBSERVER_PORT:-8080}"

    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output

    environment:
      - TZ=Asia/Shanghai
      # Web 服务器
      - WEBSERVER_PORT=${WEBSERVER_PORT:-8080}
      # 通知渠道
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL:-}
      - WEWORK_WEBHOOK_URL=${WEWORK_WEBHOOK_URL:-}
      - WEWORK_MSG_TYPE=${WEWORK_MSG_TYPE:-}
      # 邮件配置
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - EMAIL_SMTP_SERVER=${EMAIL_SMTP_SERVER:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-}
      # ntfy配置
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      # Bark配置
      - BARK_URL=${BARK_URL:-}
      # Slack配置
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # 通用Webhook配置
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL:-}
      - GENERIC_WEBHOOK_TEMPLATE=${GENERIC_WEBHOOK_TEMPLATE:-}
      # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
      - AI_ANALYSIS_ENABLED=${AI_ANALYSIS_ENABLED:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_BASE=${AI_API_BASE:-}
      # 小红书固定关键词数据源（Cookie 仅通过环境变量传入）
      - XHS_ENABLED=${XHS_ENABLED:-}
      - XHS_COOKIE=${XHS_COOKIE:-}
      - XHS_COOKIE_FILE=${XHS_COOKIE_FILE:-config/xhs_cookie.txt}
      - XHS_PROXY_URL=${XHS_PROXY_URL:-}
      # 远程存储配置（S3 兼容协议）
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-}
      # 运行模式
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/30 * * * *}
      - RUN_MODE=${RUN_MODE:-cron}
      - IMMEDIATE_RUN=${IMMEDIATE_RUN:-true}
      - MONITOR_STATE_DIR=/app/output/official-monitor
      - MONITOR_DASHBOARD_URL=http://127.0.0.1:8090
      - POLICY_DIGEST_PERIOD=${POLICY_DIGEST_PERIOD:-daily}

  trendradar-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    image: trendradar-mcp:local
    container_name: trendradar-mcp
    restart: unless-stopped

    depends_on:
      official-monitor:
        condition: service_healthy

    ports:
      - "${MCP_HOST:-127.0.0.1}:${MCP_PORT:-3333}:3333"

    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output

    environment:
      - TZ=Asia/Shanghai
      - MCP_PORT=${MCP_PORT:-3333}
      - OFFICIAL_MONITOR_URL=http://official-monitor:8090
      - OFFICIAL_MONITOR_TIMEOUT=${OFFICIAL_MONITOR_TIMEOUT:-10}
