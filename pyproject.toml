[project]
name = "trendradar"
version = "6.10.0"
description = "TrendRadar - 热点新闻聚合与分析工具"
requires-python = ">=3.12"
dependencies = [
    "requests==2.33.0",
    "pytz==2026.1",
    "tzdata==2025.2",
    "PyYAML==6.0.3",
    "fastmcp==2.12.5",
    "websockets==13.1",
    "feedparser==6.0.12",
    "boto3==1.42.76",
    "litellm==1.82.6",
    "json-repair==0.58.6",
    "tenacity==8.5.0",
    "PyExecJS==1.5.1",
    "loguru==0.7.3",
    "python-dotenv==1.1.1",
    "qrcode==8.2",
    "pypdf>=5.0,<7.0",
    "scrapling[fetchers]==0.4.10",
    "charset-normalizer==3.4.4",
]

[project.scripts]
trendradar = "trendradar.__main__:main"
trendradar-mcp = "mcp_server.server:run_server"
trendradar-xhs-login = "trendradar.crawler.xiaohongshu_login:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendradar", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests", "monitor/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
